name: Upload Release APK

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      clobber:
        description: 'Overwrite existing assets with same name'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          echo "Uploading APKs from release/ to release ${TAG}"
          ls -la release/
          if [ "${{ github.event.inputs.clobber }}" = "true" ]; then
            gh release upload "${TAG}" release/*.apk --clobber
          else
            gh release upload "${TAG}" release/*.apk
          fi
          echo "Upload complete"
          gh release view "${TAG}" --json assets --jq '.assets[].name'